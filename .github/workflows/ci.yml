name: CI

on:
  pull_request:
    branches:
      - main
      - feat/add-ai-equivalence-adjudication
  push:
    branches:
      - main
      - feat/add-ai-equivalence-adjudication

jobs:
  backend:
    name: Backend
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AcceptanceSpecSystem.sln

      - name: Test
        run: dotnet test AcceptanceSpecSystem.sln --no-restore -m:1

  frontend:
    name: Frontend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f src/AcceptanceSpecSystem.Api/Dockerfile -t acceptance-spec-api:ci .

      - name: Build Web image
        run: docker build -f web/Dockerfile -t acceptance-spec-web:ci .
