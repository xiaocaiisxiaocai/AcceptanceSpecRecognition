                  - row "9019 汕头超声CCTC 通用投收板机 收放板机通用 Tray移载机构 1、投板机采用双模组方式，其活动范围为：组合输送区、空载2、置载2。 2、夹持Tray的两个长边，每边2-3个夹爪。夹持机构应结合Tray的形状进行设计，具备基本的粗定位/管正能力。 3、一个夹持机构要能将Tray从组合输送区移到空载2并进行堆叠（必要时可设计辅助装置确保Tray堆叠成功）；另一个夹持机构能从置载2取一个满Tray移到组合区进行板件和Tray分离 4、移载机构末端采用真空吸盘+夹爪的方式，用于抓取固定尺寸的Tray，真空吸盘主要用于垂直运动；夹爪主要用于增强运动中的稳定性，夹持Tray的短边。 5、确保夹持Tray盘不会掉落，若有掉落风险的，需具备掉料检知功能，掉落时及时停止运动。 6、投板机具备吸板功能可从托盘中吸取板件，若有掉落风险的，需具备掉料检知功能，掉落时及时停止运动。 7、投板机具备板件抖动功能，用于托盘取板分离 1、1)以實際方案為準 2)以實際方案為準 1、满足要求 2、满足要求 3、滿足需求 滿足需求 - 查看 编辑 删除" [ref=f3e10911]:
