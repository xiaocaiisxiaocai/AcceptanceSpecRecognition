                      - generic "读码（读板）*" [ref=f3e10569]
                    - cell "1、读码率要求99.5% 2、海康ID54N/ID5120M及以上工业二维码读码器，填写具体型号。 3、收板机需避免读到板件内层二维码 4、读码视野需满足需求，典型二维码尺寸为8×8mm，ECC200规范，参照附件《ISO16022-2006》 5、出入料口预留五根滚轮作为读码区域，其上方300mm×300mm的立面空间内，除了读头安装架外，不得有压辊或其他部件遮挡，读码区域前后各要设置对射式或回归反射式光电传感器（倾斜安装），传感器要可靠、准确、稳定的感应到板件的有无，可与原有传感器功能复用。 6、设计角度可调的扫码器安装件，使得读头能够垂直于PCB板面的正负60度范围进行调节。 7、PLC通过以太网PLC链接模式连接读头并获取数据。 8、读头开启PLC链接模式和TCP模式。 9、由PLC实现读码数据和载具数据绑定和解绑，实时上传EAP且在PC留下绑定和解绑日志。 10、读码数据通过TCP向PC写入本地读码日志。 11、读头与PLC通讯并保持本地日志的程序由供应商完成，需记录读头连接状态，日志存储形式需与超声确认。" [ref=f3e10570]:
                      - generic "1、读码率要求99.5% 2、海康ID54N/ID5120M及以上工业二维码读码器，填写具体型号。 3、收板机需避免读到板件内层二维码 4、读码视野需满足需求，典型二维码尺寸为8×8mm，ECC200规范，参照附件《ISO16022-2006》 5、出入料口预留五根滚轮作为读码区域，其上方300mm×300mm的立面空间内，除了读头安装架外，不得有压辊或其他部件遮挡，读码区域前后各要设置对射式或回归反射式光电传感器（倾斜安装），传感器要可靠、准确、稳定的感应到板件的有无，可与原有传感器功能复用。 6、设计角度可调的扫码器安装件，使得读头能够垂直于PCB板面的正负60度范围进行调节。 7、PLC通过以太网PLC链接模式连接读头并获取数据。 8、读头开启PLC链接模式和TCP模式。 9、由PLC实现读码数据和载具数据绑定和解绑，实时上传EAP且在PC留下绑定和解绑日志。 10、读码数据通过TCP向PC写入本地读码日志。 11、读头与PLC通讯并保持本地日志的程序由供应商完成，需记录读头连接状态，日志存储形式需与超声确认。" [ref=f3e10572]
                    - 'cell "1、OK（备注：以下状况不包含在内: 1.产品弯折翘曲度>20度 2.码刮伤/模糊/变形/破损(残缺度≤20%可辨识) 3.人为干扰:收料端拿出物料 4.产品和主设备导致的不良 5.非读头设备造成的不良 6.二维码严重氧化导致二维码形态不完整或色差区分度小 7、碼本身異常或讀碼環境異常造成的讀碼失敗） 2、OK（备注：读码器型号：MV-ID54N-PCB） 3、以具体情况为准，如果条码之间没有规律可循，读码器自身无法判断要读取哪个条码，只能把读到的数据发给上位机，由上位机进行判断 4、OK（备注：DM码，条码尺寸：8*8mm，20*20点阵，单颗54N读码器视野：320*240mm，码出现在这个视野范围内可以稳定读取） 8、OK（备注：54N读码器支持TCP协议和MC等工业协议） 10、读码器支持TCP通讯，读码器只负责数据上抛，数据由上位机处理" [ref=f3e10573]':
                      - 'generic "1、OK（备注：以下状况不包含在内: 1.产品弯折翘曲度>20度 2.码刮伤/模糊/变形/破损(残缺度≤20%可辨识) 3.人为干扰:收料端拿出物料 4.产品和主设备导致的不良 5.非读头设备造成的不良 6.二维码严重氧化导致二维码形态不完整或色差区分度小 7、碼本身異常或讀碼環境異常造成的讀碼失敗） 2、OK（备注：读码器型号：MV-ID54N-PCB） 3、以具体情况为准，如果条码之间没有规律可循，读码器自身无法判断要读取哪个条码，只能把读到的数据发给上位机，由上位机进行判断 4、OK（备注：DM码，条码尺寸：8*8mm，20*20点阵，单颗54N读码器视野：320*240mm，码出现在这个视野范围内可以稳定读取） 8、OK（备注：54N读码器支持TCP协议和MC等工业协议） 10、读码器支持TCP通讯，读码器只负责数据上抛，数据由上位机处理" [ref=f3e10575]'
                    - cell "读码率评估：调试稳定运行之后，≥10000个不同样品，生产编号≥100，包含线上所有有拼板二维码板件；由买方规定双方确认二维码总数计算方式。 二维码破损、打标质量不佳等导致二维码孔点缺失达到15%、严重氧化，光学方法无法优化和解决的、人工操作干扰的不包含在读码率统计中" [ref=f3e10576]:
                      - generic "读码率评估：调试稳定运行之后，≥10000个不同样品，生产编号≥100，包含线上所有有拼板二维码板件；由买方规定双方确认二维码总数计算方式。 二维码破损、打标质量不佳等导致二维码孔点缺失达到15%、严重氧化，光学方法无法优化和解决的、人工操作干扰的不包含在读码率统计中" [ref=f3e10578]
