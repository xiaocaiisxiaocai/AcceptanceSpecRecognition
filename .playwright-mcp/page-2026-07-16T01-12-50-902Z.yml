                  - row "9021 汕头超声CCTC 通用投收板机 收放板机通用 投板机空载1、空载2、置载1、置载2* 1、整堆Tray在空载1、空载2之间，以及置载1、置载2之间，采用滚筒的形式进行转移，转移时不得卡住。 2、Tray堆叠的顶部可能会有轻微偏移，夹取时需考虑或设计Tray定位机构，要有前后左右整Tray功能，保证Tray堆叠整齐。 3、具备堆叠直接测高功能，进而实时计算出空载1、空载2、置载1、置载2当前堆叠中Tray的层数。 4、空载1、置载1的入口采用轮子导引。 5、空载1、空载2、置载1、置载2滚筒输送平面前后安装两组对射感应器（带防撞设计）可靠检知Tray有无，安装减速感应器保证Tray盘减速到位。 6、空载2、置载2具备Tray盘升降防过冲检测设计。 7、空载1和空载2之间以及置载1和置载2中间加装对射感应器，检测Tray盘处于两个工位间的状态，保证Tray运输到位，可以有效检测Tray盘部分未完全脱离空载1或空载2或置载1或置载2 满足要求 - 查看 编辑 删除" [ref=f3e10839]:
