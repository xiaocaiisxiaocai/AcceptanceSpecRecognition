                  - row "9020 汕头超声CCTC 通用投收板机 收放板机通用 投板机组合输送区 1、对接主线输送板件和分离、组合板件和Tray；由传送区和组合构成。 2、组合输送区的传送机构，在规定使用寿命内不允许掉屑。输送驱动设计在操作侧。 3、组合区的支撑结构采用岛状布置，需能够让Tray盘完全沉入。岛状传送可升降，见附图2示意图。 4、在组合输送区的岛状滚轮与输送滚轮之间的间隙，应设计防止薄板垂弯的机构。 5、投板机具备两片检知功能。 6、关于拍板： 7、具备拍板功能，位于出料口 8、支持对射光纤拍板，支持尺寸拍板。 9、最小拍板尺寸能力400mm（小于规格的最小板）。 10、定位精度±1mm，侧边拍板、序列拍板定位精度±2mm，薄板拍板时不得拱弯。 11、支持中心拍、序列拍、侧边拍。 1、滿足需求 2、滿足需求 3、以實際方案為準 4、滿足需求 5、标准无，可配置 6、伺服拍板可满足±1mm - 查看 编辑 删除" [ref=f3e10875]:
