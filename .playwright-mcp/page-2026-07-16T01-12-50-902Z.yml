                  - 'row "9192 汕头超声CCTC 斜立式收放板机 收放板机通用 读码（载具）* 1、载具二维码无破损无污染情况下，读码率要求100% 2、基恩士SR-752读码器或与前者读码性能同级别及以上读码器，填写具体型号。 3、PLC通过以太网PLC链接模式连接读头并获取数据。 4、读头开启PLC链接模式和TCP模式。 5、由PLC将板件读码数据和载具数据绑定和解绑，实时上传EAP且在PC留下绑定日志。 6、PC实时存储载具数据，写入本地读码日志。 7、本地存储日志的程序由供应商完成，日志存储形式需与超声确认。 1、OK（备注 以下状况不包含在内: 1.产品弯折翘曲度>20度 2.码刮伤/模糊/变形/破损(残缺度≤20%可辨识) 3.人为干扰:收料端拿出物料 4.产品和主设备导致的不良 5.非读头设备造成的不良 6.二维码严重氧化导致二维码形态不完整或色差区分度小 7、碼本身異常或讀碼環境異常造成的讀碼失敗） 2、OK（备注：读码器型号为24R系列读码器） 4、OK（备注：24R读码器支持TCP协议和MC等工业协议） - 查看 编辑 删除" [ref=f3e4814]':
