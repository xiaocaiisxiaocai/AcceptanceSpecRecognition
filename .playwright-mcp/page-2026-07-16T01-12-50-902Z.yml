                  - row "9022 汕头超声CCTC 通用投收板机 收放板机通用 投板机工作模式 Tray循环式作业，不吸板，只吸夹Tray，在组合输送区进行板Tray分离。即： 1、投板时，从置载2取满Tray到组合输送区，并在传送上方释放，Tray在自重作用下被传送下方的滑台移载接住，板件与滚轮直接接触，启动传送滚轮送板出料。当出料完成后，传送机构下降，滑台移载可将空Tray从组合输送区平移到空载2，并在空载2对空Tray进行堆叠。 2、Tray的流转：置载1（满Tray）→置载2（满Tray）→组合输送区（满Tray）→Tray与PCB分离→组合输送区（空Tray）→空载2（空Tray）→垂直堆叠（空Tray）。 滿足需求 - 查看 编辑 删除" [ref=f3e10803]:
