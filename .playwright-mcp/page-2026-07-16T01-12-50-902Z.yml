                  - row "9036 汕头超声CCTC 通用投收板机 收放板机通用 移载机构 1、采用机械手立装方式，其活动范围为：组合输送区、NG位、空载1、置载1。 2、移载机构末端采用真空吸盘+夹爪的方式，用于抓取固定尺寸的Tray，真空吸盘主要用于垂直运动；夹爪主要用于增强运动中的稳定性，夹持Tray的短边。 3、确保夹持Tray盘不会掉落，若有掉落风险的，需具备掉料检知功能，掉落时及时停止运动。 4、机械手具备吸板功能吸取板件，若有掉落风险的，需具备掉料检知功能，掉落时及时停止运动。 5、投板机机械手具备抖动功能，收板机机械手具备除静电设计，用于收板使用托盘时防飘板。 6、托盘模式机械手根据板件特性设计复合吸盘、仿生吸盘或夹爪等辅助吸板设计 1、1)以實際方案為準 3、满足需求 2)以實際方案為準 1、满足要求 2、满足要求 - 查看 编辑 删除" [ref=f3e10370]:
