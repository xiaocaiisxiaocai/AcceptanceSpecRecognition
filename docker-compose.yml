services:
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: acceptance-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-acceptance_spec_db}
      MYSQL_USER: ${MYSQL_USER:-acceptance}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/AcceptanceSpecSystem.Api/Dockerfile
    container_name: acceptance-api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-acceptance_spec_db};User=${MYSQL_USER:-acceptance};Password=${MYSQL_PASSWORD};CharSet=utf8mb4;
      FileStorage__BasePath: /data/files
      DataProtection__KeysPath: /data/dp-keys
      DatabaseBackup__BackupDirectory: /app/backups
      ApiRateLimits__Login__PermitLimit: ${API_RATE_LIMIT_LOGIN_PERMIT_LIMIT:-10}
      ApiRateLimits__Login__WindowSeconds: ${API_RATE_LIMIT_LOGIN_WINDOW_SECONDS:-60}
      ApiRateLimits__Upload__PermitLimit: ${API_RATE_LIMIT_UPLOAD_PERMIT_LIMIT:-20}
      ApiRateLimits__Upload__WindowSeconds: ${API_RATE_LIMIT_UPLOAD_WINDOW_SECONDS:-60}
      ApiRateLimits__AiHeavy__PermitLimit: ${API_RATE_LIMIT_AI_HEAVY_PERMIT_LIMIT:-30}
      ApiRateLimits__AiHeavy__WindowSeconds: ${API_RATE_LIMIT_AI_HEAVY_WINDOW_SECONDS:-60}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0:?CORS_ORIGIN_0 must be set}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1:-}
      BrowserAuth__AllowInsecureHttp: ${BROWSER_AUTH_ALLOW_INSECURE_HTTP:-false}
      BrowserAuth__RefreshCookieName: ${BROWSER_AUTH_REFRESH_COOKIE_NAME:-__Host-acceptance-refresh}
      BrowserAuth__CookieSecure: ${BROWSER_AUTH_COOKIE_SECURE:-true}
      BrowserAuth__CookieSameSite: ${BROWSER_AUTH_COOKIE_SAME_SITE:-Strict}
      BrowserAuth__CookieDomain: ${BROWSER_AUTH_COOKIE_DOMAIN:-}
      ProxyForwarding__Enabled: "true"
      ProxyForwarding__ForwardLimit: "1"
      ProxyForwarding__KnownNetworks__0: ${APP_NETWORK_SUBNET:-172.30.0.0/24}
      JwtAuth__SigningKey: ${JWT_SIGNING_KEY}
      AuthSeed__AdminPassword: ${AUTH_SEED_ADMIN_PASSWORD}
      AuthSeed__CommonPassword: ${AUTH_SEED_COMMON_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - api-files:/data/files
      - api-dpkeys:/data/dp-keys
      - api-backups:/app/backups
    ports:
      - "127.0.0.1:${API_HOST_PORT:-5290}:8080"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: acceptance-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755,uid=101,gid=101
      - /var/run:size=8m,mode=0755,uid=101,gid=101
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:8080"

volumes:
  mysql-data:
  api-files:
  api-dpkeys:
  api-backups:

networks:
  default:
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET:-172.30.0.0/24}
