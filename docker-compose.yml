services:
  mysql:
    image: mysql:8.0
    container_name: acceptance-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-acceptance_spec_db}
      MYSQL_USER: ${MYSQL_USER:-acceptance}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/AcceptanceSpecSystem.Api/Dockerfile
    container_name: acceptance-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-acceptance_spec_db};User=${MYSQL_USER:-acceptance};Password=${MYSQL_PASSWORD};CharSet=utf8mb4;
      FileStorage__BasePath: /data/files
      DataProtection__KeysPath: /data/dp-keys
      DatabaseBackup__BackupDirectory: /app/backups
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0:-http://localhost}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1:-http://127.0.0.1}
      JwtAuth__SigningKey: ${JWT_SIGNING_KEY}
      AuthSeed__AdminPassword: ${AUTH_SEED_ADMIN_PASSWORD}
      AuthSeed__CommonPassword: ${AUTH_SEED_COMMON_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - api-files:/data/files
      - api-dpkeys:/data/dp-keys
      - api-backups:/app/backups
    ports:
      - "5290:8080"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: acceptance-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  mysql-data:
  api-files:
  api-dpkeys:
  api-backups:
